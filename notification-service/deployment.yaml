apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: notification-service
          image: ecommerce/notification-service:local
          ports:
            - containerPort: 5005
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: SERVICE_TOKEN
            - name: NODEMAILER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: NODEMAILER_EMAIL
            - name: NODEMAILER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: NODEMAILER_PASSWORD
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: TWILIO_PHONE_NUMBER
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5005
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5005
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
