name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install all services
        run: |
          for service in user-service product-service shopping-cart-service order-service payment-service notification-service; do
            (cd "$service" && npm ci)
          done
      - run: npm test
      - run: npm run audit
  containers:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service, shopping-cart-service, order-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: false
